name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 mins (Render sleeps after 15 mins)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Krushak Render backend..."
          # Replace with your actual Render URL after first deploy
          URL="https://krushak-backend.onrender.com"
          # fallback if custom name - ping both possible
          for u in "https://krushak-backend.onrender.com" "https://krushak.onrender.com" "https://krushak-backend-xxxx.onrender.com"; do
            echo "Trying $u"
            curl -s -o /dev/null -w "%{http_code} %{url_effective}\n" --max-time 15 "$u" || true
            curl -s -o /dev/null -w "%{http_code} %{url_effective}\n" --max-time 15 "$u/api/stats" || true
          done
          # Primary URL (edit this to your real Render URL)
          curl -fsS --max-time 20 "${{ secrets.RENDER_URL || 'https://krushak-backend.onrender.com' }}" > /dev/null && echo "✅ Render alive" || echo "⚠️ Render ping failed - check URL"
          curl -fsS --max-time 20 "${{ secrets.RENDER_URL || 'https://krushak-backend.onrender.com' }}/api/stats" > /dev/null && echo "✅ API alive" || true

      - name: Ping Vercel Frontend (optional)
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://krushak.vercel.app" || true
          echo "Vercel ping done"
