{% extends "base.html" %}
{% block title %}Farmer Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center mb-4">
        <div class="mx-auto bg-warning rounded-circle d-flex align-items-center justify-content-center mb-2" style="width:56px;height:56px;"><i class="bi bi-person fs-4"></i></div>
        <h3 class="fw-bold">Farmer Login</h3>
        <p class="text-muted small">Use Username or Email. Demo: <strong>ramesh / farmer123</strong></p>
      </div>
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">
          <form method="POST">
            <label class="form-label fw-semibold small">Username or Email</label>
            <div class="input-group mb-3">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input name="username" class="form-control form-control-lg" placeholder="Enter username" required>
            </div>
            <label class="form-label fw-semibold small">Password</label>
            <div class="input-group mb-2">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input name="password" type="password" class="form-control form-control-lg" placeholder="Password" required>
            </div>
            <div class="d-flex justify-content-between small">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
              <span class="text-muted">Forgot? Call helpline</span>
            </div>
            <button class="btn btn-success btn-lg w-100 mt-4 fw-bold" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Login to Dashboard</button>
            <div class="text-center small mt-3">New farmer? <a href="{{ url_for('farmer_register') }}" class="fw-bold text-success">Register in 30 sec</a></div>
          </form>
        </div>
      </div>
      <div class="text-center mt-3"><a href="{{ url_for('admin_login') }}" class="small text-muted">Are you Admin? Login here</a></div>
    </div>
  </div>
</div>
{% endblock %}
