{% extends "base.html" %}
{% block title %}Farmer Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <div class="mx-auto d-flex align-items-center justify-content-center mb-3" style="width:56px;height:56px; background:var(--green); color:var(--snow); border-radius:50%;" aria-hidden="true"><i class="bi bi-person fs-4"></i></div>
        <h1 class="h3 fw-bold" style="color:var(--green);">Farmer Login</h1>
        <p class="small" style="color:rgba(27,122,59,0.68);">Use Username or Email. Demo: <strong style="color:var(--green);">ramesh / farmer123</strong></p>
      </div>
      <div class="card border-0 shadow" style="border-radius:16px; background:var(--snow);">
        <div class="card-body p-4">
          <form method="POST" class="d-flex flex-column">
            <label class="form-label fw-semibold small mb-1" for="username" style="color:var(--green);">Username or Email</label>
            <div class="input-group mb-3">
              <span class="input-group-text" style="background:#F8F9FA; border:1.5px solid #E8EAED; border-right:none; border-radius:12px 0 0 12px; padding:0 14px; color:#5F6368;" aria-hidden="true"><i class="bi bi-person"></i></span>
              <input id="username" name="username" class="form-control" placeholder="ramesh" required aria-label="Username or Email" style="background:white; border:1.5px solid #E8EAED; border-left:none; border-radius:0 12px 12px 0; padding:12px 14px; font-size:16px; color:var(--green);">
            </div>
            <label class="form-label fw-semibold small mb-1" for="password" style="color:var(--green);">Password</label>
            <div class="input-group mb-3">
              <span class="input-group-text" style="background:#F8F9FA; border:1.5px solid #E8EAED; border-right:none; border-radius:12px 0 0 12px; padding:0 14px; color:#5F6368;" aria-hidden="true"><i class="bi bi-lock"></i></span>
              <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" required aria-label="Password" style="background:white; border:1.5px solid #E8EAED; border-left:none; border-radius:0 12px 12px 0; padding:12px 14px; font-size:16px;">
            </div>
            <div class="d-flex justify-content-between align-items-center w-100 mb-1" style="font-size:14px;">
              <div class="form-check m-0 d-flex align-items-center" style="gap:8px; min-height:24px;">
                <input class="form-check-input" type="checkbox" id="remember" style="width:20px; height:20px; border:1.5px solid var(--green); border-radius:4px; margin-top:0; flex-shrink:0;">
                <label class="form-check-label" for="remember" style="cursor:pointer; color:var(--green); font-weight:500; line-height:1;">Remember me</label>
              </div>
              <a href="#" class="text-decoration-none" style="color:var(--green); font-weight:500; font-size:13px;">Forgot? Call helpline</a>
            </div>
            <button class="btn w-100 mt-4 fw-bold d-flex align-items-center justify-content-center" type="submit" style="background:var(--green); color:var(--snow); border:1.5px solid var(--green); border-radius:12px; padding:13px; font-size:16px; box-shadow:0 4px 12px rgba(27,122,59,0.18);">
              <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Login to Dashboard
            </button>
            <div class="text-center small mt-3" style="color:var(--green);">New farmer? <a href="{{ url_for('farmer_register') }}" class="fw-bold" style="color:var(--green); text-decoration:underline; text-underline-offset:3px;">Register in 30 sec</a></div>
            <hr class="my-3" style="border-color:var(--green-line); opacity:1;">
            <div class="text-center">
              <a href="{{ url_for('admin_login') }}" style="color:var(--green); font-weight:600; font-size:14px; text-decoration:underline; text-underline-offset:3px;">Are you Admin? Login here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
