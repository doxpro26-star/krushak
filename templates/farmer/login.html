{% extends "base.html" %}
{% block title %}Farmer Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center mb-4">
        <div class="mx-auto rounded-circle d-flex align-items-center justify-content-center mb-2" style="width:56px;height:56px; background:var(--green); color:var(--snow);" aria-hidden="true"><i class="bi bi-person fs-4"></i></div>
        <h1 class="h3 fw-bold">Farmer Login</h1>
        <p class="text-muted small">Use Username or Email. Demo: <strong>ramesh / farmer123</strong></p>
      </div>
      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">
          <form method="POST" class="d-flex flex-column">
            <label class="form-label fw-semibold small mb-1" for="username">Username or Email</label>
            <div class="input-group mb-3 w-100">
              <span class="input-group-text" aria-hidden="true"><i class="bi bi-person"></i></span>
              <input id="username" name="username" class="form-control form-control-lg" placeholder="Enter username" required aria-label="Username or Email">
            </div>
            <label class="form-label fw-semibold small mb-1" for="password">Password</label>
            <div class="input-group mb-2 w-100">
              <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
              <input id="password" name="password" type="password" class="form-control form-control-lg" placeholder="Password" required aria-label="Password">
            </div>
            <div class="d-flex justify-content-between small w-100 mt-1">
              <div class="form-check m-0"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
              <span class="text-muted">Forgot? Call helpline</span>
            </div>
            <button class="btn btn-success btn-lg w-100 mt-4 fw-bold" type="submit" style="border-radius:var(--r-md);"><i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Login to Dashboard</button>
            <div class="text-center small mt-3">New farmer? <a href="{{ url_for('farmer_register') }}" class="fw-bold text-success">Register in 30 sec</a></div>
          </form>
        </div>
      </div>
      <div class="text-center mt-3"><a href="{{ url_for('admin_login') }}" class="small text-muted">Are you Admin? Login here</a></div>
    </div>
  </div>
</div>
{% endblock %}
